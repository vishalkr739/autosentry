[tool.poetry]
name = "autosentry_agent"
version = "0.1.0"
description = "Autosentry agent backend"
packages = [{ include = "autosentry_agent" }]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.53.0"}
langgraph = "^1.2.12"
langchain = "^1.4.2"
tigergraph-mcp = "^1.0.3"
httpx = "^0.28.1"
sqlalchemy = "^2.0.54"
alembic = "^1.20.0"
psycopg = {extras = ["binary"], version = "^3.3.6"}
numpy = "^2.5.3"
pydantic-settings = "^2.15.0"
boto3 = "^1.43.99"
mcp = "^1.30.0"
langchain-openai = "^1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
ruff = "^0.6"
mypy = "^1.11"
boto3-stubs = "^1.43.100"

[[tool.mypy.overrides]]
# tigergraph-mcp ships no py.typed marker; analyze its source anyway so
# TigerGraphToolName (a plain str Enum) is genuinely type-checked.
module = ["tigergraph_mcp", "tigergraph_mcp.*"]
follow_untyped_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
