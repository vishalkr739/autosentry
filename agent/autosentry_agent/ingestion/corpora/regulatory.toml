# Global regulatory knowledge corpus (canonical spec: FATF/FinCEN/OFAC).
# Every document is public and official. sha256 pins the exact file that was
# reviewed; the driver refuses a download that doesn't match.
#
# FATF documents can't be downloaded programmatically (fatf-gafi.org serves
# files behind a Cloudflare challenge). Save them from a browser as
# agent/.corpus_cache/<doc_id>.pdf; the driver uses a cached file as-is and
# only verifies its hash.

graph = "AutosentryRegulatoryKB"

[access]
tenant_id = "global"
roles = ["analyst"]

