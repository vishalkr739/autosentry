services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autosentry
      POSTGRES_PASSWORD: autosentry
      POSTGRES_DB: autosentry_dev
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # tigergraph-mcp as its own service over streamable HTTP (the same shape as
  # savanna-agent). It holds no credentials: each MCP session brings its
  # TigerGraph identity in X-TG-* headers, so it must only be reachable from
  # inside this network (published to localhost only, for local tools).
  tigergraph-mcp:
    build: ./agent  # the agent image already has tigergraph-mcp installed
    command: ["tigergraph-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8010"]
    ports: ["127.0.0.1:8010:8010"]

  agent:
    build: ./agent
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://autosentry:autosentry@postgres:5432/autosentry_dev
      SECRETS_BACKEND: env
      GRAPH_DATA_MCP_URL: http://tigergraph-mcp:8010
    depends_on: [postgres, tigergraph-mcp]
    ports: ["8000:8000"]

volumes:
  postgres-data:

# web/ is not containerized (matches cloud-portal: static build, no
# Dockerfile). Run it directly: `cd web && npm run dev`.
#
# TigerGraph itself is a TigerGraph Cloud workspace (TG_HOST in .env), and
# graphrag runs from its own repo's Docker Compose (see its README).
