services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autosentry
      POSTGRES_PASSWORD: autosentry
      POSTGRES_DB: autosentry_dev
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  agent:
    build: ./agent
    environment:
      DATABASE_URL: postgresql+psycopg://autosentry:autosentry@postgres:5432/autosentry_dev
      SECRETS_BACKEND: env
    depends_on: [postgres]
    ports: ["8000:8000"]

volumes:
  postgres-data:

# web/ is not containerized (matches cloud-portal: static build, no
# Dockerfile). Run it directly: `cd web && npm run dev`.
#
# tigergraph and graphrag services are added back to this file once
# Tasks 5/6/7/9 (MCP-transport-dependent work) are unblocked.
