name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  agent-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run mypy autosentry_agent

  agent-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/unit -v

  agent-integration-tests:
    # Excludes tests/integration/test_mcp_connectivity.py and
    # test_schema_deploy.py, both held alongside Tasks 5/6/7/9.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autosentry
          POSTGRES_PASSWORD: autosentry
          POSTGRES_DB: autosentry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: agent
    env:
      TEST_DATABASE_URL: postgresql+psycopg://autosentry:autosentry@localhost:5432/autosentry_test
      DATABASE_URL: postgresql+psycopg://autosentry:autosentry@localhost:5432/autosentry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/integration/test_migrations.py -v

  agent-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - run: pip install pip-audit && poetry run pip-audit --strict

  guardrail-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      # Zero tests today; wired in now as a required check so Phase 3
      # adds tests here without touching this file (spec section 1.6).
      - run: poetry run pytest tests/guardrail -v || test $? -eq 5

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  web-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  web-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx vitest run
